<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My form</title>
    <base target="_top" />
    <style>
      html,
      body {
        font-family: sans-serif, Arial;
      }
      h1 {
        text-align: center;
      }
      iframe {
        margin: auto;
      }
      #footer {
        padding: 5px;
      }
      #timer {
        display: flex;
        justify-content: space-between;
        width: 600px;
        margin: auto;
      }
      .container {
        width: 90%;
        margin: auto;
      }
      .g-form {
        height: calc(100vh - 150px);
        width: 100%
      }
    </style>
  </head>
  <body>
    <div id="fb-root"></div>
    <div class="container">
      <div id="timer">
        <p>Time left: <span id="time-remaining"></span></p>
      </div>
      <iframe 
        class="g-form"
        frameborder="0" marginheight="0" marginwidth="0"
      >
            Loading?
      </iframe>
      <button onclick="shareOnFacebook()">
        Share on Facebook
      </button>
    </div>
    <div id="footer"><div class="container"></div>
    </div>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v20.0&appId=557972274585947" nonce="s6UAdZBr"></script>
    <script>
      const REPORT_URL = "https://script.google.com/macros/s/AKfycbypAT3IqWLLiYxyb2xtPT0g69t2R7MDbUm96rJNH2A6Ng2--5ZA2avVsZRebIa2ucMqQw/exec"
      const pad = (num, places=2) => String(num).padStart(places, '0');

      function secs2str(secs) {
        var hours = Math.trunc(secs / 3600);
        secs -= hours * 3600;
        var mins = Math.trunc(secs / 60);
        secs -= mins * 60;
        return `${hours}:${pad(mins, 2)}:${pad(secs, 2)}`
      }
      
      //const shareButton = document.querySelector('.fb-share-button');
      const sharedLink = document.querySelector('.fb-share-link');
      const iframe = document.querySelector('.g-form');
      const timer = document.querySelector('#timer');
      const h1 = document.querySelector('h1');
      const trs = document.querySelector('#time-remaining');
      const footer = document.querySelector('#footer');

      var fbSharedUrl = "";

      var args64 = new URLSearchParams(window.location.search).get("A");
      var args = JSON.parse(atob(args64));
      console.log(args);

      if (args.repostId) {
  fbSharedUrl = args.repostId;

  // If the URL is relative or missing scheme, prepend https://
  if (!fbSharedUrl.startsWith("http")) {
    fbSharedUrl = "https://" + fbSharedUrl;
  }

  // Show the Facebook button
  shareButton.style.display = "inline";
}

// Updated share function
function shareOnFacebook() {
  if (!fbSharedUrl) return;
  const uri = encodeURIComponent(fbSharedUrl);
  const fbUrl = `https://www.facebook.com/sharer/sharer.php?u=${uri}`;
  window.open(fbUrl, '', 'menubar=no,toolbar=no,resizable=yes,scrollbars=yes,height=300,width=600');
}
//const fbButton = document.querySelector('.fb-share-button');
//fbButton.setAttribute('data-href', args.repostId);
//FB.XFBML.parse();

      function showShareButton(sharedUrl) {
        shareButton.setAttribute("data-href", sharedUrl);
        shareButton.setAttribute("style", "display: inline");

        var uri = encodeURIComponent(sharedUrl);
        sharedLink.setAttribute("href", `https://www.facebook.com/sharer/sharer.php?u=${uri}&amp;src=sdkpreparse`);

        console.log("sharedUrl: ", sharedUrl);
      }

      function setFbRepost(json) {
        var data = JSON.parse(json);
        console.log(data);
        fbSharedUrl = data.sharedUrl;
        showShareButton(data.sharedUrl)
      }

      var secsLeft = args.minutes * 60;
      const totalSecs = args.minutes * 60;

      // Try to restore start time from localStorage
      let startTimeLocation = localStorage.getItem("startTimeLocation" + args.studentId + args.studentClass);

      // If not found, save current time as start time
      if (!startTimeLocation) {
        let startTimeTmp = new Date().getTime();
        localStorage.setItem("startTimeLocation" + args.studentId + args.studentClass, startTimeTmp);
      }

      trs.innerText =  secs2str(totalSecs);
      iframe.src = args.formUrl;

      function updateTimer() {
        const now = new Date().getTime();
		let startTime = localStorage.getItem("startTimeLocation" + args.studentId + args.studentClass);
		if (!startTime) {
			trs.innerText = "Error in startTime";
			return;
		}
		
        const elapsedSecs = Math.floor((now - startTime) / 1000);
        const remainingSecs = totalSecs - elapsedSecs;

        if (remainingSecs <= 0) {
        trs.innerText = "Please, submit your answers, your time is over";
        clearInterval(timerInterval);
        return;
        }

        trs.innerText = secs2str(remainingSecs);
      }

      var now = new Date().toLocaleString();

      var data = {
        formUrl: args.formUrl,
        studentId: args.studentId,
        repostId: args.repostId,
        minutes: args.minutes,
        studentClass: args.studentClass,
        start: now
      }

      // https://stackoverflow.com/questions/41946457/getting-text-from-fetch-response-object
      fetch(REPORT_URL, {
        redirect: "follow",
        method: "POST",
        body: JSON.stringify(data),
        headers: {
          "Content-Type": "text/plain"
      }})
      .then(response => response.text())
      .then(json => setFbRepost(json))
      .catch(err => console.log(err));

      updateTimer();
      const timerInterval = setInterval(updateTimer, 1000);

    </script>
  </body>
</html>
